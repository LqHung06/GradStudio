name: CI Verification Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Gate 1 - Syntax check and seed JSON validation
        run: |
          for f in mock/server.mjs mock/lib/*.mjs mock/routes/*.mjs tools/*.mjs; do
            node --check "$f"
          done
          node -e '
            const fs = require("node:fs");
            const files = fs.readdirSync("mock/data").filter(f => f.endsWith(".json")).sort();
            for (const f of files) JSON.parse(fs.readFileSync(`mock/data/${f}`, "utf8"));
            console.log(`Parsed ${files.length} seed JSON file(s) successfully.`);
          '

      - name: Gate 2 - API contract check on fresh mock server
        run: |
          PORT=3001 MOCK_MODE=normal node mock/server.mjs > /tmp/ci-mock.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/services > /dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          node tools/contract-check.mjs --base http://127.0.0.1:3001

      - name: Gate 3 - Business rules regression tests (node:test)
        run: node --test tools/tv1-rules.test.mjs tools/tv3-booking-rules.test.mjs

      - name: Gate 4 - Client dependency install and production build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Gate 5 - Repo hygiene (no conflict markers)
        run: |
          if git grep -n -E '^(<<<<<<<|=======$|>>>>>>>)' -- client docs mock tools '*.md' '*.yml'; then
            echo "Found unresolved conflict markers."
            exit 1
          fi
          echo "No conflict markers found."
